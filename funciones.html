<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let hello = function (nombre) {
        return `Hola ${nombre}`;
      };

      console.log(hello("pepe"));

      function holaBuenasTardes(foo) {
        foo();
      }

      holaBuenasTardes(function () {
        console.log("holabuenastardes");
      });

      function adiosMuyBuenas(nombre) {
        console.log(`adios muy buenas ${nombre}`);
      }

      holaBuenasTardes(function () {
        adiosMuyBuenas("pepito");
      });
    </script>
  </body>
</html>
