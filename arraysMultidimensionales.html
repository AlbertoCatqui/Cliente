<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var tablaA = [
        [1, 2, 3],
        [4, 5, 6],
        [7, 8, 9],
        ["A", "B", "C"],
      ];
      console.log("Longitud array " + tablaA.length);
      console.log("Longitud elemento 0 array " + tablaA[0].length);
      tablaA[1][1] = 20;
      console.log(tablaA[1][1]);

      console.log("-Recorrer con FOR array bidimensional-");
      for (let i = 0; i < tablaA.length; i++) {
        for (let j = 0; j < tablaA[i].length; j++) {
          console.log(tablaA[i][j]);
        }
      }

      console.log("-Recorrer con FOREACH array bidimensional-");
      tablaA.forEach(function (elementoExterno, i) {
        tablaA[i].forEach(function (elementoInterno, j) {
          console.log(tablaA[i][j]);
        });
      });
      console.log("");
      console.log("CREAR ARRAY BIDIMENSIONAL A PARTIR DE UNO UNIDIMENSIONAL");
      var tablaB = new Array(5);
      tablaB.fill(["A", "B", "C"]);
      console.log(tablaB);
      console.log("");
      console.log("CREAR ARRAY BIDIMENSIONAL A PARTIR DE DOS UNIDIMENSIONAL");
      var tablaC = Array.of([1, 2, 3], [3, 4, 5], ["a"]);
      console.log(tablaC);
      console.log("");
      
      console.log(
        "Pintar array multidmensional con cada array en una sola línea",
      );
      for (let i = 0; i < tablaA.length; i++) {
        console.log(tablaA[i].join(", "));
      }
    </script>
  </body>
</html>
