<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>

<body>
    <script>
        console.log(">PI");
        console.log(Math.PI);

        console.log(">E");
        console.log(Math.E);

        console.log(">abs");
        console.log(Math.abs(-7.5));
        console.log(Math.abs(7.5));

        console.log(">sin, cos, tan");
        console.log(Math.sin(Math.PI / 2));
        console.log(Math.cos(0));
        console.log(Math.tan(Math.PI / 4));

        console.log(">exp");
        console.log(Math.exp(1));
        console.log(Math.exp(2));

        console.log(">log");
        console.log(Math.log(Math.E));
        console.log(Math.log(10));

        console.log(">ceil");
        console.log(Math.ceil(4.1));
        console.log(Math.ceil(-4.9));

        console.log(">floor");
        console.log(Math.floor(4.9));
        console.log(Math.floor(-4.1));

        console.log(">round");
        console.log(Math.round(4.5));
        console.log(Math.round(4.4));
        console.log(Math.round(-4.6));
        console.log(Math.round(-4.5));

        console.log(">pow");
        console.log(Math.pow(2, 3));
        console.log(Math.pow(5, 2));
        console.log(Math.pow(9, 0.5));

        console.log(">min");
        console.log(Math.min(3, 8, -2, 10));

        console.log(">max");
        console.log(Math.max(3, 8, -2, 10));

        console.log(">sqrt");
        console.log(Math.sqrt(81));
        console.log(Math.sqrt(2));

        console.log(">random");
        console.log(Math.random()); //num entre 0 y 1
        console.log(Math.floor(Math.random() * 10)); //entre 0 y 9
        console.log(Math.floor(Math.random() * 6) + 1); //de 1 a 6
    </script>
</body>

</html>
