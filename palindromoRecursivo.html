  <body>
    <script>
      function palindromo(n) {
        if (n.lenth() <= 1) {
          return true;
        }
        if (n[0] == n[n.lenth - 1]) {
          return palindromo(n);
        }
        palindromo();
      }
    </script>
  </body>
