<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      let arraytest = [2, 3, 1, 5, 6, 7, 12, 9, 8];
      console.log(arraytest);
      //sort sin funcion para ordenar "no lo hace correctamente"
      console.log(arraytest.sort());
      //con la funcion ordena bien
      console.log(
        arraytest.sort(function (a, b) {
          //console.log(arraytest);
          return a - b;
        }),
      );
      console.log(arraytest);
    </script>
  </body>
</html>
