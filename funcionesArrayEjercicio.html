<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      let a = [1, 2, 3, 4];

      let f1 = (arr) => arr.map((n) => n * 3).filter((n) => n % 4 === 0);

      let f2 = (arr) =>
        arr.filter((n) => n % 2 !== 0).forEach((n) => console.log(n));

      let f3 = (arr) =>
        arr.reduce((suma, n, i) => (i % 2 === 0 ? suma + n : suma), 0);
      console.log("-----Función 1-----");
      console.log(f1(a));
      console.log("-----Función 2-----");
      f2(a);
      console.log("-----Función 3-----");
      console.log(f3(a));
    </script>
  </body>
</html>
