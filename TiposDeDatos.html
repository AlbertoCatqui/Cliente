<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      console.log(
        "-----------------------------Tipo de datos-------------------------------",
      );
      let numero1 = 1;
      console.log("El tipo de numero1 es: " + typeof numero1);
      let numero2 = 1.03;
      console.log("El tipo de numero2 es: " + typeof numero2);
      let booleano = true;
      console.log("El tipo de booleano es: " + typeof booleano);
      let cadena = "Hola";
      console.log("El tipo de cadena es: " + typeof cadena);
      let nulo = null;
      console.log("El tipo de nulo es: " + typeof nulo);
      console.log("El valor de nulo es: " + nulo);
      let indefinido;
      console.log("El tipo de indefinido es: " + typeof indefinido);
      console.log("El valor de indefinido es: " + indefinido);
      let objeto = { a: 1 };
      console.log("El tipo de objeto es: " + typeof objeto);

      console.log(
        "-------------------------------------------------------------------------",
      );
      console.log(
        "-----------------------Tipo de datos (Contructor)------------------------",
      );
      console.log(
        "-------------------------------------------------------------------------",
      );

      console.log("El tipo de cadena es: " + typeof cadena);
      console.log("El constructor de cadena es: " + cadena.constructor.name);

      console.log("El tipo de numero1 es: " + typeof numero1);
      console.log("El constructor de numero1 es: " + numero1.constructor.name);

      console.log("El tipo de booleano es: " + typeof booleano);
      console.log(
        "El constructor de booleano es: " + booleano.constructor.name,
      );
    </script>
  </body>
</html>
