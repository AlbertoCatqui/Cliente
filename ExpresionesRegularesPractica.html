<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>

  <body>
    <script>
      function comprobar(titulo, dato, expr) {
        let valido = expr.test(dato);
        document.body.innerHTML +=
          "<p>" + titulo + ": " + dato + " es " + valido + "</p>";
        if (!valido) {
          alert("El campo " + titulo + " no cumple con las especificaciones");
        }
      }

      let nombre = prompt("Nombre", "Pepe");
      let apellidos = prompt("Apellidos", "Sánchez Vallejo");
      let edad = prompt("Edad", "30");
      let email = prompt("Email", "pepesanvall@test.mod");
      let telefono = prompt("Teléfono", "612123123");
      let centro = prompt("Centro:", "IES Julián Marías");
      let curso = prompt("Curso (1 o 2)", "1");
      let observaciones = prompt("Observaciones", "Tal");
      let anio = prompt("Año", "2026");

      comprobar("Nombre", nombre, /^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{1,}/); //1 o mas A-z contando con tildes y ñ
      comprobar(
        "Apellidos",
        apellidos,
        /^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{1,}(^[A-ZÁÉÍÓÚÑ][a-záéíóúñ]{1,}){0,}/,
      );
      comprobar("Edad", edad, /\d{1,3}/); //digito numerico de 1 a 3 caracteres
      comprobar("Email", email, /[\w.-]{1,}@[a-zA-Z0-9]{1,}\.[a-zA-Z]{2,3}/);
      /* empieza por 1 o mas caracteres alfanuméricos(. _ - incluidos), una @, caracteres alfanumericos, un . y 2 o 3 caracteres.*/
      comprobar("Teléfono", telefono, /^[69]\d{8}/); //un 6 o un 9 seguido de otros 8 números
      comprobar("Centro", centro, /.{5,120}/); //de 5 a 120 caracteres
      comprobar("Curso", curso, /[12]/); //1 o 2
      comprobar("Observaciones", observaciones, /[\wáéíóúñÁÉÍÓÚÑ ]{1,120}/); //caracteres alfanuméricos(. _ - incluidos), de 1 a 120
      comprobar("Año", anio, /^(19|20)\d{2}/); //Empieza por 19 o 20 y lo siguien otros 2 digitos numéricos
    </script>
  </body>
</html>
